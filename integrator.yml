server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${instanceId:${random.value}}

spring:
  application:
   name: integrator
  datasource:
    url: jdbc:postgresql://localhost:5432/testjpa
    username: system
    password: manager
    driver-class-name: org.postgresql.Driver
    tomcat:
      max-active: 10
      initial-size:  5
  jpa:
    show-sql: true
    format_sql: true
    show_sql_comments: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate.ddl-auto: create
  h2:
    console:
      enabled: true
    settings:
      web-allow-others: true

feign:
  client:
   config:
     default:
       connectTimeout: 25000
       readTimeout: 25000
       loggerLevel: FULL
       defaultRequestHeaders:
         Accept: application/json
         Content-Type: application/json
     gpoInboundAdapterClient:
       readTimeout: 50000

retry:
  max-attempts: 1
  period: 3000
  max-period: 10000
  delay: 5000
  multiplier: 2

backoff:
  initial-interval: 5000
  multiplier: 1
  max-attempts: 2
  max-interval: 10000

gpo-inbound-adapter:
  url: http://localhost:8082/inbound-adapter

management:
  endpoints:
    web:
      exposure:
        include: info,health,env,metrics,loggers,retries
  endpoint:
    health:
      show-details: always
      show-components: always
      exclude: [discoveryComposite, discoveryClient]
