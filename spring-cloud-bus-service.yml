server:
  port: 0

echo:
  message:
    text: 'Hello, World! Santhosh !!'

spring:
  application:
    name: spring-cloud-bus-service
  cloud:
    config:
      enabled: true
      uri: http://localhost:8888
    bus:
      enabled: true
      trace:
        enabled: true
      refresh:
        enabled: true
      env:
        enabled: true
  kafka:
    bootstrap-servers: localhost:29092
management:
  endpoints:
    web:
      exposure:
        include: busrefresh,health,info,env,metrics
        
