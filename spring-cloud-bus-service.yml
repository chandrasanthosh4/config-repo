server:
  port: 0

echo:
  message:
    text: 'Hello, World! Janaki !!'

spring:
  application:
    name: spring-cloud-bus-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    config:
      enabled: true
      uri: http://localhost:8888
  kafka:
    bootstrap-servers:
    - localhost:9092

    bus:
      enabled: true
      trace:
        enabled: true
      refresh:
        enabled: true
      env:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: busrefresh,health,info,env,metrics
        
