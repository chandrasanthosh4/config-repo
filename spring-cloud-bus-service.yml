server:
  port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance-id}

echo:
  message:
    text: 'Hello World.. Manaswini !!'

spring:
  application:
    name: spring-cloud-bus-service
  cloud:
    enabled: true
    uri: http://localhost:8888
    stream:
      bindings:
        springCloudBusInput:
          group: CG.${spring.application.name}:${spring.application.instance-id}
          destination: TP.POC.CONFIG.REFRESH
        springCloudBusOutput:
          destination: TP.POC.CONFIG.REFRESH
    bus:
      enabled: true
      destination: TP.POC.CONFIG.REFRESH
      id: ${spring.application.name}:${spring.application.instance-id}
      trace:
        enabled: true
      refresh:
        enabled: true
      env:
        enabled: true
  kafka:
    bootstrap-servers: localhost:29092

management:
  endpoints:
    web:
      exposure:
        include: busrefresh,health,info,env,metrics
  endpoint:
    env:
      show-values: ALWAYS
